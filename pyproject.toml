[project]
name = "telegram-shop-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2",
    "bepusdt>=0.3.15",
    "cryptography>=43",
    "python-telegram-bot>=21",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shopbot*"]
