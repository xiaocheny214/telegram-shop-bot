name: PR Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const number = context.payload.pull_request.number
            const prefixes = ['[Bug]:', '[Feature]:', '[Docs]:', '[Experiment]:', '[Proposal]:']
            const result = await github.graphql(
              `query ($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes { title }
                    }
                  }
                }
              }`,
              { owner, repo, number },
            )
            const issues = result.repository.pullRequest.closingIssuesReferences.nodes
            if (issues.length === 0) {
              core.setFailed('This pull request is not linked to an issue. Add "Closes #" to the description, or link it in the Development section.')
              return
            }
            const prefixOf = (title) => prefixes.find((prefix) => title.startsWith(`${prefix} `))
            const issuePrefixes = [...new Set(issues.map((issue) => prefixOf(issue.title)).filter(Boolean))]
            if (issuePrefixes.length !== 1) {
              core.setFailed('The linked issue title must start with one of [Bug]:, [Feature]:, [Docs]:, [Experiment]:, [Proposal]:. A pull request can close issues of only one type.')
              return
            }
            const title = context.payload.pull_request.title
            if (prefixOf(title) !== issuePrefixes[0]) {
              core.setFailed(`The pull request title must start with "${issuePrefixes[0]} " to match the linked issue.`)
              return
            }
            core.info(`Pull request title matches the linked issue prefix ${issuePrefixes[0]}.`)
