name: Bug report
description: 报告缺陷、回归或与预期不符的行为。
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: 实际发生了什么。附上操作、错误信息或日志片段。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: 应该发生什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: 从打开机器人或运行命令开始，按顺序写出复现步骤。
      placeholder: |
        1. 在买家或商家机器人里打开 ...
        2. 选择 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 版本号或 commit、部署环境（本地 Docker 或远程）、买家或商家机器人、支付渠道。
