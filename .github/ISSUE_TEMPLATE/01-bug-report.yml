name: Bug report
description: Report a defect, regression, or behavior that does not match the expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: What actually happened. Include the action, error message, or a log snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening the bot or running a command, and list the steps in order.
      placeholder: |
        1. Open the buyer or merchant bot and go to ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, where it runs (local Docker or the remote server), buyer or merchant bot, and the payment channel.
