name: Documentation
description: Add, correct, or rewrite user documentation or collaboration guidelines.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Which document is missing, wrong, or outdated, and what problem that causes for the reader.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the document should make clear after the change.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this change will explicitly leave undone.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to tell the work is done.
    validations:
      required: true
